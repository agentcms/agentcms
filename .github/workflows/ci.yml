name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npm run build
      # src/routes/** ships as source and is excluded from the build's tsconfig, so without this the
      # only runtime files every consumer executes were never type-checked by anything.
      - run: npm run typecheck:routes
      - run: npm test
